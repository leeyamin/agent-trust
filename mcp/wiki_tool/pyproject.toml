[project]
name = "wiki_tool"
version = "0.1.0"
description = "Wikipedia lookup MCP tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "urllib3>=2.7.0",
    "python-multipart>=0.0.32",
    "fastmcp>=3.4.2",
    "uvicorn>=0.49.0",
    "starlette>=1.3.1",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
]
