[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-trust"
version = "0.1.0"
description = "Capability contract validation framework for A2A-protocol agents"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk",
    "claude-agent-sdk",
    "mlflow>=3.5",
    "pydantic>=2.0",
    "httpx2>=2.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
viz = [
    "plotly>=6.0",
    "squarify>=0.4",
    "kaleido>=0.2",
]

[project.scripts]
agenttrust = "agenttrust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agenttrust"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
