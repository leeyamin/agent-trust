[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-trust"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk",
    "claude-agent-sdk",
    "httpx>=0.27",
    "transformers>=4.40",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
